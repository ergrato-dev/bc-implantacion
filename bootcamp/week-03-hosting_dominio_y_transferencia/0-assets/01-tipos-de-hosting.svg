<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Tipos de hosting: control y responsabilidad</text>

  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Eje -->
  <line x1="40" y1="200" x2="770" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#p)"/>
  <text x="40" y="224" font-size="12" fill="#3fb950">Menos control · el proveedor administra más</text>
  <text x="770" y="224" font-size="12" fill="#f85149" text-anchor="end">Más control · tú administras más</text>

  <!-- Tarjetas -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="56" width="110" height="120" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="85" y="80" font-weight="700" fill="#3fb950">Estático</text>
    <text x="85" y="104" fill="#e6edf3">Archivos</text>
    <text x="85" y="122" fill="#8b949e">HTML · CSS · JS</text>
    <text x="85" y="156" font-size="10.5" fill="#8b949e">GitHub Pages</text>

    <rect x="152" y="56" width="110" height="120" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="207" y="80" font-weight="700" fill="#3fb950">PaaS</text>
    <text x="207" y="104" fill="#e6edf3">Código o</text>
    <text x="207" y="122" fill="#e6edf3">contenedor</text>
    <text x="207" y="156" font-size="10.5" fill="#8b949e">Render</text>

    <rect x="274" y="56" width="110" height="120" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="329" y="80" font-weight="700" fill="#d29922">Compartido</text>
    <text x="329" y="104" fill="#e6edf3">Carpeta +</text>
    <text x="329" y="122" fill="#e6edf3">panel</text>
    <text x="329" y="156" font-size="10.5" fill="#8b949e">Hosting PHP</text>

    <rect x="396" y="56" width="110" height="120" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="451" y="80" font-weight="700" fill="#d29922">VPS</text>
    <text x="451" y="104" fill="#e6edf3">VM con root</text>
    <text x="451" y="122" fill="#8b949e">SO a tu cargo</text>
    <text x="451" y="156" font-size="10.5" fill="#8b949e">VM del laboratorio</text>

    <rect x="518" y="56" width="110" height="120" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="573" y="80" font-weight="700" fill="#f85149">Dedicado</text>
    <text x="573" y="104" fill="#e6edf3">Servidor</text>
    <text x="573" y="122" fill="#e6edf3">físico</text>
    <text x="573" y="156" font-size="10.5" fill="#8b949e">Bare metal</text>

    <rect x="640" y="56" width="130" height="120" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="705" y="80" font-weight="700" fill="#f85149">Propio</text>
    <text x="705" y="104" fill="#e6edf3">Tu centro</text>
    <text x="705" y="122" fill="#e6edf3">de datos</text>
    <text x="705" y="156" font-size="10.5" fill="#8b949e">Rack + hipervisor</text>
  </g>

  <text x="400" y="264" font-size="12" fill="#e6edf3" text-anchor="middle">A más control, más responsabilidad: parches, seguridad, respaldos y disponibilidad</text>
  <text x="400" y="284" font-size="11" fill="#8b949e" text-anchor="middle">Un proyecto puede combinar tipos: frontend estático + API en PaaS + base de datos gestionada</text>
</svg>

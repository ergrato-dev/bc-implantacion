<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Resolución de api.miapp.com.co</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <!-- Navegador -->
    <rect x="20" y="130" width="120" height="60" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="80" y="156" font-weight="700" fill="#e6edf3">Navegador</text>
    <text x="80" y="174" fill="#8b949e">tu equipo</text>

    <!-- Resolvedor -->
    <rect x="220" y="130" width="140" height="60" rx="6" fill="#0d2040" stroke="#1565c0"/>
    <text x="290" y="156" font-weight="700" fill="#58a6ff">Resolvedor</text>
    <text x="290" y="174" fill="#8b949e">1.1.1.1 · caché</text>

    <!-- Servidores -->
    <rect x="520" y="54" width="250" height="50" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="645" y="76" font-weight="700" fill="#e6edf3">Servidores raíz  ( . )</text>
    <text x="645" y="94" font-size="11" fill="#8b949e">"pregunta a los servidores de .co"</text>

    <rect x="520" y="134" width="250" height="50" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="645" y="156" font-weight="700" fill="#e6edf3">Servidores del TLD  ( .co )</text>
    <text x="645" y="174" font-size="11" fill="#8b949e">"el autoritativo de miapp.com.co es…"</text>

    <rect x="520" y="214" width="250" height="50" rx="6" fill="#12301c" stroke="#3fb950"/>
    <text x="645" y="236" font-weight="700" fill="#3fb950">Autoritativo de miapp.com.co</text>
    <text x="645" y="254" font-size="11" fill="#e6edf3">api → 203.0.113.10 · TTL 300</text>
  </g>

  <!-- Flechas -->
  <g stroke-width="1.5" fill="none">
    <line x1="140" y1="152" x2="218" y2="152" stroke="#58a6ff" marker-end="url(#a)"/>
    <line x1="220" y1="170" x2="142" y2="170" stroke="#3fb950" marker-end="url(#v)"/>
    <line x1="360" y1="140" x2="518" y2="82" stroke="#58a6ff" marker-end="url(#a)"/>
    <line x1="360" y1="160" x2="518" y2="160" stroke="#58a6ff" marker-end="url(#a)"/>
    <line x1="360" y1="180" x2="518" y2="236" stroke="#58a6ff" marker-end="url(#a)"/>
  </g>

  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="180" y="144" fill="#58a6ff">1</text>
    <text x="430" y="104" fill="#58a6ff">2</text>
    <text x="440" y="152" fill="#58a6ff">3</text>
    <text x="430" y="222" fill="#58a6ff">4</text>
    <text x="180" y="186" fill="#3fb950">5 · IP</text>
  </g>

  <text x="400" y="296" font-size="12" fill="#8b949e" text-anchor="middle">Si el resolvedor ya tiene la respuesta en caché (dentro del TTL), responde directo: pasos 2-4 se omiten</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="280" fill="#0d1117"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">FTP frente a SFTP</text>

  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- FTP -->
  <text x="40" y="66" font-size="14" font-weight="700" fill="#f85149">FTP · texto plano, dos conexiones</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="80" width="110" height="70" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="95" y="120" fill="#e6edf3">Cliente</text>
    <rect x="650" y="80" width="110" height="70" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="705" y="120" fill="#e6edf3">Servidor</text>
  </g>
  <line x1="150" y1="98" x2="648" y2="98" stroke="#f85149" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="400" y="92" font-size="11" fill="#f85149" text-anchor="middle">:21 control → USER deploy · PASS secreto123</text>
  <line x1="150" y1="134" x2="648" y2="134" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="400" y="128" font-size="11" fill="#f85149" text-anchor="middle">puerto de datos → contenido del archivo legible</text>
  <text x="400" y="150" font-size="10.5" fill="#8b949e" text-anchor="middle">Cualquiera en la red puede leer la contraseña</text>

  <!-- SFTP -->
  <text x="40" y="186" font-size="14" font-weight="700" fill="#3fb950">SFTP · un túnel SSH cifrado</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="198" width="110" height="60" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="95" y="226" fill="#e6edf3">Cliente</text>
    <text x="95" y="244" font-size="10.5" fill="#8b949e">llave privada</text>
    <rect x="650" y="198" width="110" height="60" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="705" y="226" fill="#e6edf3">Servidor</text>
    <text x="705" y="244" font-size="10.5" fill="#8b949e">llave pública</text>
  </g>
  <rect x="160" y="206" width="480" height="44" rx="18" fill="#12301c" stroke="#3fb950"/>
  <line x1="175" y1="238" x2="625" y2="238" stroke="#3fb950" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="400" y="222" font-size="11" fill="#3fb950" text-anchor="middle">:22 · comandos, credenciales y archivos cifrados</text>
</svg>

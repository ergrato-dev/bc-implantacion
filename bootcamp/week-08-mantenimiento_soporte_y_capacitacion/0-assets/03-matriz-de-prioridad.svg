<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="330" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Matriz de prioridad: impacto × urgencia</text>

  <g font-size="11.5" fill="#8b949e" text-anchor="middle">
    <text x="330" y="66">Bloquea el trabajo de hoy</text>
    <text x="500" y="66">Afecta esta semana</text>
    <text x="670" y="66">Puede esperar</text>
    <text x="500" y="50" font-weight="700" fill="#e6edf3">Urgencia</text>
  </g>
  <g font-size="11.5" fill="#8b949e" text-anchor="end">
    <text x="236" y="104">Nadie puede usarla</text>
    <text x="236" y="164">Función sin alternativa</text>
    <text x="236" y="224">Falla con alternativa</text>
    <text x="236" y="284">Molestia menor</text>
  </g>
  <text x="40" y="190" font-size="12" font-weight="700" fill="#e6edf3" transform="rotate(-90 40 190)" text-anchor="middle">Impacto</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="250" y="76" width="160" height="50" rx="4" fill="#3a1414" stroke="#f85149"/><text x="330" y="107" fill="#f85149">P1</text>
    <rect x="420" y="76" width="160" height="50" rx="4" fill="#3a1414" stroke="#f85149"/><text x="500" y="107" fill="#f85149">P1</text>
    <rect x="590" y="76" width="160" height="50" rx="4" fill="#2d2210" stroke="#d29922"/><text x="670" y="107" fill="#d29922">P2</text>

    <rect x="250" y="136" width="160" height="50" rx="4" fill="#3a1414" stroke="#f85149"/><text x="330" y="167" fill="#f85149">P1</text>
    <rect x="420" y="136" width="160" height="50" rx="4" fill="#2d2210" stroke="#d29922"/><text x="500" y="167" fill="#d29922">P2</text>
    <rect x="590" y="136" width="160" height="50" rx="4" fill="#161b22" stroke="#58a6ff"/><text x="670" y="167" fill="#58a6ff">P3</text>

    <rect x="250" y="196" width="160" height="50" rx="4" fill="#2d2210" stroke="#d29922"/><text x="330" y="227" fill="#d29922">P2</text>
    <rect x="420" y="196" width="160" height="50" rx="4" fill="#161b22" stroke="#58a6ff"/><text x="500" y="227" fill="#58a6ff">P3</text>
    <rect x="590" y="196" width="160" height="50" rx="4" fill="#161b22" stroke="#8b949e"/><text x="670" y="227" fill="#8b949e">P4</text>

    <rect x="250" y="256" width="160" height="50" rx="4" fill="#161b22" stroke="#58a6ff"/><text x="330" y="287" fill="#58a6ff">P3</text>
    <rect x="420" y="256" width="160" height="50" rx="4" fill="#161b22" stroke="#8b949e"/><text x="500" y="287" fill="#8b949e">P4</text>
    <rect x="590" y="256" width="160" height="50" rx="4" fill="#161b22" stroke="#8b949e"/><text x="670" y="287" fill="#8b949e">P4</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="280" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Ciclo de una actualización de dependencias</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="130" height="56" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="85" y="94" fill="#e6edf3">Dependabot</text><text x="85" y="112" font-size="10" fill="#8b949e">versión nueva o alerta</text>
    <rect x="175" y="70" width="130" height="56" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="240" y="94" fill="#e6edf3">pull request</text><text x="240" y="112" font-size="10" fill="#8b949e">agrupado por tipo</text>
    <rect x="330" y="70" width="130" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="395" y="94" fill="#e6edf3">ci.yml</text><text x="395" y="112" font-size="10" fill="#8b949e">construir + humo</text>
    <rect x="485" y="70" width="130" height="56" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="550" y="94" fill="#e6edf3">revisión humana</text><text x="550" y="112" font-size="10" fill="#8b949e">notas de versión</text>
    <rect x="640" y="70" width="140" height="56" rx="8" fill="#12301c" stroke="#3fb950"/>
    <text x="710" y="94" fill="#3fb950">v1.3.1</text><text x="710" y="112" font-size="10" fill="#8b949e">release.yml (semana 7)</text>

    <rect x="330" y="170" width="130" height="50" rx="8" fill="#3a1414" stroke="#f85149"/>
    <text x="395" y="192" fill="#f85149">CI en rojo</text><text x="395" y="208" font-size="10" fill="#8b949e">no se fusiona</text>
    <rect x="485" y="170" width="130" height="50" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="550" y="192" fill="#d29922">mayor</text><text x="550" y="208" font-size="10" fill="#8b949e">se planea aparte</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="150" y1="98" x2="173" y2="98" marker-end="url(#a)"/>
    <line x1="305" y1="98" x2="328" y2="98" marker-end="url(#a)"/>
    <line x1="460" y1="98" x2="483" y2="98" marker-end="url(#a)"/>
    <line x1="615" y1="98" x2="638" y2="98" marker-end="url(#a)"/>
    <line x1="395" y1="126" x2="395" y2="168" marker-end="url(#a)" stroke="#f85149"/>
    <line x1="550" y1="126" x2="550" y2="168" marker-end="url(#a)" stroke="#d29922"/>
  </g>

  <text x="400" y="256" font-size="11.5" fill="#8b949e" text-anchor="middle">Seguridad: días · Menores: cada semana o dos · Mayores: planeadas, con pruebas y notas leídas</text>
</svg>

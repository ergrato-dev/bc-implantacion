<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Cómo trabaja Ansible</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="30" y="56" width="330" height="240" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="50" y="80" font-size="13.5" font-weight="700" fill="#58a6ff">Nodo de control</text>
  <g font-size="12" fill="#e6edf3">
    <rect x="50" y="94" width="290" height="36" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="64" y="117">inventario.ini</text><text x="326" y="117" font-size="10.5" fill="#8b949e" text-anchor="end">a quién y cómo</text>
    <rect x="50" y="138" width="290" height="36" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="64" y="161">instalar-biblioteca.yml</text><text x="326" y="161" font-size="10.5" fill="#8b949e" text-anchor="end">qué estado</text>
    <rect x="50" y="182" width="290" height="36" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="64" y="205">group_vars/ + plantillas/</text><text x="326" y="205" font-size="10.5" fill="#8b949e" text-anchor="end">con qué valores</text>
    <rect x="50" y="226" width="290" height="36" rx="6" fill="#0d1117" stroke="#d29922"/>
    <text x="64" y="249">vault.yml (cifrado)</text><text x="326" y="249" font-size="10.5" fill="#8b949e" text-anchor="end">secretos</text>
  </g>

  <rect x="480" y="90" width="290" height="170" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="500" y="114" font-size="13.5" font-weight="700" fill="#3fb950">Servidor</text>
  <g font-size="12" fill="#e6edf3">
    <text x="500" y="140">Solo necesita SSH + Python</text>
    <text x="500" y="162">Sin agente instalado</text>
    <text x="500" y="192" fill="#8b949e">cada tarea: ¿ya está bien?</text>
    <text x="510" y="212" fill="#3fb950">ok</text><text x="540" y="212" fill="#8b949e">no hace nada</text>
    <text x="510" y="232" fill="#d29922">changed</text><text x="570" y="232" fill="#8b949e">corrige y notifica</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="360" y1="160" x2="478" y2="160" marker-end="url(#a)"/>
    <line x1="478" y1="190" x2="362" y2="190" marker-end="url(#a)"/>
  </g>
  <text x="420" y="152" font-size="11" fill="#8b949e" text-anchor="middle">SSH + módulos</text>
  <text x="420" y="206" font-size="11" fill="#8b949e" text-anchor="middle">resultado</text>
  <text x="625" y="290" font-size="11" fill="#8b949e" text-anchor="middle">2.ª ejecución sin cambios: changed=0</text>
</svg>

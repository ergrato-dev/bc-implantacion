<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Ciclo de trabajo de OpenTofu</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="130" height="56" rx="8" fill="#161b22" stroke="#8b949e"/>
    <text x="85" y="94" fill="#e6edf3">main.tf</text><text x="85" y="112" font-size="10" fill="#8b949e">estado deseado</text>
    <rect x="180" y="70" width="120" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="240" y="94" fill="#e6edf3">tofu init</text><text x="240" y="112" font-size="10" fill="#8b949e">proveedores</text>
    <rect x="330" y="62" width="140" height="72" rx="8" fill="#2d2210" stroke="#d29922" stroke-width="2"/>
    <text x="400" y="88" font-weight="700" fill="#d29922">tofu plan</text><text x="400" y="106" font-size="10" fill="#8b949e">código vs estado vs real</text><text x="400" y="122" font-size="10" fill="#d29922">se lee SIEMPRE</text>
    <rect x="500" y="70" width="120" height="56" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="560" y="94" fill="#e6edf3">tofu apply</text><text x="560" y="112" font-size="10" fill="#8b949e">hace el plan</text>
    <rect x="650" y="70" width="130" height="56" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="715" y="94" fill="#e6edf3">tfstate</text><text x="715" y="112" font-size="10" fill="#f85149">contiene secretos</text>

    <rect x="330" y="190" width="140" height="56" rx="8" fill="#3a1414" stroke="#f85149"/>
    <text x="400" y="214" fill="#f85149">cambio a mano</text><text x="400" y="232" font-size="10" fill="#8b949e">deriva</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="150" y1="98" x2="178" y2="98" marker-end="url(#a)"/>
    <line x1="300" y1="98" x2="328" y2="98" marker-end="url(#a)"/>
    <line x1="470" y1="98" x2="498" y2="98" marker-end="url(#a)"/>
    <line x1="620" y1="98" x2="648" y2="98" marker-end="url(#a)"/>
    <path d="M715,126 L715,160 L420,160 L420,136" marker-end="url(#a)"/>
    <line x1="400" y1="188" x2="400" y2="138" marker-end="url(#a)" stroke="#f85149"/>
  </g>
  <text x="570" y="175" font-size="10.5" fill="#8b949e" text-anchor="middle">el siguiente plan compara</text>
  <g font-size="11" fill="#8b949e">
    <text x="40" y="276">+ crear · ~ modificar · -/+ reemplazar (riesgo: datos) · - destruir</text>
  </g>

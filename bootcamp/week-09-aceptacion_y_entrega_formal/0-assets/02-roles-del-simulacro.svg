<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Roles del simulacro cruzado</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="70" width="200" height="120" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="130" y="96" font-size="13.5" font-weight="700" fill="#58a6ff">Equipo que entrega</text>
    <text x="130" y="122" fill="#e6edf3">Plan de Implantación v1.0</text>
    <text x="130" y="142" fill="#e6edf3">Respaldo cifrado + huella</text>
    <text x="130" y="170" font-size="10.5" fill="#f85149">no habla durante el intento</text>

    <rect x="570" y="70" width="200" height="120" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="670" y="96" font-size="13.5" font-weight="700" fill="#3fb950">Equipo que instala</text>
    <text x="670" y="122" fill="#e6edf3">Servidor limpio</text>
    <text x="670" y="142" fill="#e6edf3">Solo el plan, en orden</text>
    <text x="670" y="170" font-size="10.5" fill="#d29922">cada pregunta = desviación</text>

    <rect x="300" y="200" width="200" height="100" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="400" y="226" font-size="13.5" font-weight="700" fill="#d29922">Observador</text>
    <text x="400" y="250" fill="#e6edf3">Cronometra y registra</text>
    <text x="400" y="270" fill="#e6edf3">Decide si se invalida</text>
    <text x="400" y="290" font-size="10.5" fill="#f85149">no ayuda</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="230" y1="110" x2="568" y2="110" marker-end="url(#a)"/>
    <path d="M230,150 C330,150 330,150 568,150" marker-end="url(#a)" stroke="#a371f7" stroke-dasharray="5 4"/>
    <line x1="500" y1="240" x2="600" y2="192" marker-end="url(#a)"/>
    <line x1="300" y1="240" x2="200" y2="192" marker-end="url(#a)"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="400" y="102" fill="#8b949e">plan + paquete (carpeta, SFTP)</text>
    <text x="400" y="142" fill="#a371f7">contraseñas por OTRO canal</text>
    <text x="580" y="226" fill="#8b949e">registro de desviaciones</text>
    <text x="220" y="226" fill="#8b949e">correcciones al plan</text>
  </g>
</svg>

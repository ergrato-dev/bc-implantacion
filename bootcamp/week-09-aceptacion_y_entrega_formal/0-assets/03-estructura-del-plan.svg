<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="330" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Estructura del Plan de Implantación</text>

  <g font-size="12">
    <rect x="30" y="54" width="360" height="40" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="46" y="79" fill="#e6edf3">1. Ficha técnica y requisitos</text><text x="374" y="79" font-size="10.5" fill="#8b949e" text-anchor="end">sem 1 · CE-1, CE-2</text>
    <rect x="30" y="102" width="360" height="40" rx="6" fill="#161b22" stroke="#a371f7"/>
    <text x="46" y="127" fill="#e6edf3">2. Migración de datos</text><text x="374" y="127" font-size="10.5" fill="#8b949e" text-anchor="end">sem 2, 5 · CE-3</text>
    <rect x="30" y="150" width="360" height="40" rx="6" fill="#161b22" stroke="#a371f7"/>
    <text x="46" y="175" fill="#e6edf3">3. Respaldo y restauración</text><text x="374" y="175" font-size="10.5" fill="#8b949e" text-anchor="end">sem 2, 6 · CE-4</text>
    <rect x="30" y="198" width="360" height="40" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="46" y="223" fill="#e6edf3">4. Hosting y dominio</text><text x="374" y="223" font-size="10.5" fill="#8b949e" text-anchor="end">sem 3 · CE-1</text>
    <rect x="30" y="246" width="360" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="46" y="271" fill="#e6edf3">5. Instalación</text><text x="374" y="271" font-size="10.5" fill="#8b949e" text-anchor="end">sem 2, 4 · CE-1, CE-5</text>

    <rect x="410" y="54" width="360" height="40" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="426" y="79" fill="#e6edf3">6. Configuración y verificación</text><text x="754" y="79" font-size="10.5" fill="#8b949e" text-anchor="end">sem 5 · CE-1</text>
    <rect x="410" y="102" width="360" height="40" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="426" y="127" fill="#e6edf3">7. Seguridad, usuarios y permisos</text><text x="754" y="127" font-size="10.5" fill="#8b949e" text-anchor="end">sem 6 · CE-1</text>
    <rect x="410" y="150" width="360" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="426" y="175" fill="#e6edf3">8. Pipeline y monitoreo</text><text x="754" y="175" font-size="10.5" fill="#8b949e" text-anchor="end">sem 7 · CE-1, CE-5</text>
    <rect x="410" y="198" width="360" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="426" y="223" fill="#e6edf3">9. Mantenimiento, soporte, capacitación</text><text x="754" y="223" font-size="10.5" fill="#8b949e" text-anchor="end">sem 8 · CE-5</text>
    <rect x="410" y="246" width="360" height="40" rx="6" fill="#2d2210" stroke="#d29922" stroke-width="2"/>
    <text x="426" y="271" font-weight="700" fill="#d29922">10. Aceptación y entrega</text><text x="754" y="271" font-size="10.5" fill="#8b949e" text-anchor="end">sem 9 · CE-1 a CE-5</text>
  </g>
  <text x="400" y="312" font-size="11" fill="#8b949e" text-anchor="middle">El simulacro prueba sobre todo las secciones 5 y 3: instalar desde cero y restaurar</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Aceptación y entrega formal</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="140" height="66" rx="8" fill="#161b22" stroke="#8b949e"/>
    <text x="90" y="96" fill="#e6edf3">Plan consolidado</text><text x="90" y="114" font-size="10" fill="#8b949e">secciones 1-9</text><text x="90" y="128" font-size="10" fill="#8b949e">versión 1.0</text>

    <rect x="180" y="70" width="140" height="66" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="250" y="96" fill="#e6edf3">Aceptación</text><text x="250" y="114" font-size="10" fill="#8b949e">el cliente ejecuta</text><text x="250" y="128" font-size="10" fill="#8b949e">los casos</text>

    <rect x="340" y="62" width="150" height="82" rx="8" fill="#2d2210" stroke="#d29922" stroke-width="2"/>
    <text x="415" y="90" font-weight="700" fill="#d29922">Simulacro cruzado</text><text x="415" y="108" font-size="10" fill="#8b949e">otro equipo instala</text><text x="415" y="122" font-size="10" fill="#8b949e">y restaura solo con el plan</text><text x="415" y="136" font-size="10" font-weight="700" fill="#d29922">GATE</text>

    <rect x="510" y="70" width="130" height="66" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="575" y="96" fill="#e6edf3">Acta de entrega</text><text x="575" y="114" font-size="10" fill="#8b949e">niveles de servicio</text><text x="575" y="128" font-size="10" fill="#8b949e">accesos, garantía</text>

    <rect x="660" y="70" width="120" height="66" rx="8" fill="#12301c" stroke="#3fb950"/>
    <text x="720" y="96" fill="#3fb950">Producción</text><text x="720" y="114" font-size="10" fill="#8b949e">socialización</text><text x="720" y="128" font-size="10" fill="#8b949e">y soporte</text>

    <rect x="180" y="200" width="140" height="50" rx="8" fill="#3a1414" stroke="#f85149"/>
    <text x="250" y="222" fill="#f85149">Rechazado</text><text x="250" y="238" font-size="10" fill="#8b949e">corregir y repetir casos</text>
    <rect x="340" y="200" width="150" height="50" rx="8" fill="#3a1414" stroke="#f85149"/>
    <text x="415" y="222" fill="#f85149">No superado</text><text x="415" y="238" font-size="10" fill="#8b949e">corregir el plan (v1.1)</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="160" y1="103" x2="178" y2="103" marker-end="url(#a)"/>
    <line x1="320" y1="103" x2="338" y2="103" marker-end="url(#a)"/>
    <line x1="490" y1="103" x2="508" y2="103" marker-end="url(#a)"/>
    <line x1="640" y1="103" x2="658" y2="103" marker-end="url(#a)"/>
    <line x1="250" y1="136" x2="250" y2="198" marker-end="url(#a)" stroke="#f85149"/>
    <line x1="415" y1="144" x2="415" y2="198" marker-end="url(#a)" stroke="#f85149"/>
    <path d="M180,225 L90,225 L90,138" marker-end="url(#a)" stroke="#f85149" stroke-dasharray="4 3"/>
    <path d="M490,225 L505,225 L505,170 L100,170 L100,138" marker-end="url(#a)" stroke="#f85149" stroke-dasharray="4 3"/>
  </g>
  <text x="400" y="285" font-size="11" fill="#8b949e" text-anchor="middle">Cada falla vuelve al plan: se corrige, se versiona y se repite la prueba que falló</text>
</svg>

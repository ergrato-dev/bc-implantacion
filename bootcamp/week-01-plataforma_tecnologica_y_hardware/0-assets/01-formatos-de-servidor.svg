<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Formatos físicos de servidor</text>

  <!-- ===== Torre ===== -->
  <rect x="20" y="50" width="240" height="250" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="140" y="76" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">Torre</text>
  <rect x="105" y="92" width="70" height="140" rx="5" fill="#1c2a3a" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="115" y="104" width="50" height="10" rx="2" fill="#0d1117" stroke="#30363d"/>
  <rect x="115" y="120" width="50" height="10" rx="2" fill="#0d1117" stroke="#30363d"/>
  <circle cx="140" cy="210" r="5" fill="#3fb950"/>
  <text x="140" y="256" font-size="12" fill="#8b949e" text-anchor="middle">Barato, sin gabinete</text>
  <text x="140" y="274" font-size="12" fill="#8b949e" text-anchor="middle">1-2 servidores · oficina</text>

  <!-- ===== Rack ===== -->
  <rect x="280" y="50" width="240" height="250" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="400" y="76" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">Rack (19")</text>
  <rect x="330" y="88" width="140" height="150" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="340" y="98" width="120" height="14" rx="2" fill="#1c2a3a" stroke="#30363d"/>
  <text x="400" y="109" font-size="10" fill="#e6edf3" text-anchor="middle">Switch · 1U</text>
  <rect x="340" y="116" width="120" height="14" rx="2" fill="#1c2a3a" stroke="#30363d"/>
  <text x="400" y="127" font-size="10" fill="#e6edf3" text-anchor="middle">Servidor web · 1U</text>
  <rect x="340" y="134" width="120" height="14" rx="2" fill="#1c2a3a" stroke="#30363d"/>
  <text x="400" y="145" font-size="10" fill="#e6edf3" text-anchor="middle">Servidor app · 1U</text>
  <rect x="340" y="152" width="120" height="30" rx="2" fill="#1c2a3a" stroke="#30363d"/>
  <text x="400" y="171" font-size="10" fill="#e6edf3" text-anchor="middle">Base de datos · 2U</text>
  <rect x="340" y="186" width="120" height="42" rx="2" fill="#1c2a3a" stroke="#30363d"/>
  <text x="400" y="211" font-size="10" fill="#e6edf3" text-anchor="middle">UPS · 3U</text>
  <text x="400" y="256" font-size="12" fill="#8b949e" text-anchor="middle">1U = 44,45 mm · gabinete 42U</text>
  <text x="400" y="274" font-size="12" fill="#8b949e" text-anchor="middle">3-40 servidores · centro de datos</text>

  <!-- ===== Blade ===== -->
  <rect x="540" y="50" width="240" height="250" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="660" y="76" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">Blade</text>
  <rect x="580" y="88" width="160" height="150" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <g fill="#1c2a3a" stroke="#30363d">
    <rect x="590" y="98" width="14" height="94" rx="2"/>
    <rect x="608" y="98" width="14" height="94" rx="2"/>
    <rect x="626" y="98" width="14" height="94" rx="2"/>
    <rect x="644" y="98" width="14" height="94" rx="2"/>
    <rect x="662" y="98" width="14" height="94" rx="2"/>
    <rect x="680" y="98" width="14" height="94" rx="2"/>
    <rect x="698" y="98" width="14" height="94" rx="2"/>
    <rect x="716" y="98" width="14" height="94" rx="2"/>
  </g>
  <rect x="590" y="200" width="140" height="28" rx="2" fill="#0d2040" stroke="#1565c0"/>
  <text x="660" y="218" font-size="10" fill="#58a6ff" text-anchor="middle">Chasis compartido</text>
  <text x="660" y="256" font-size="12" fill="#8b949e" text-anchor="middle">Máxima densidad</text>
  <text x="660" y="274" font-size="12" fill="#8b949e" text-anchor="middle">40+ servidores · si falla el chasis…</text>
</svg>

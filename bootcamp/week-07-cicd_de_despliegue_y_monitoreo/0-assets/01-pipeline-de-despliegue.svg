<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="330" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Pipeline de despliegue de la app de referencia</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- CI -->
  <rect x="20" y="52" width="760" height="70" rx="8" fill="none" stroke="#30363d" stroke-dasharray="6 4"/>
  <text x="34" y="70" font-size="11.5" font-weight="700" fill="#58a6ff">ci.yml · cada push y pull request</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="80" width="130" height="32" rx="6" fill="#161b22" stroke="#8b949e"/><text x="125" y="101" fill="#e6edf3">commit / PR</text>
    <rect x="240" y="80" width="130" height="32" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="305" y="101" fill="#e6edf3">construir</text>
    <rect x="420" y="80" width="150" height="32" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="495" y="101" fill="#e6edf3">prueba de humo</text>
    <rect x="620" y="80" width="140" height="32" rx="6" fill="#12301c" stroke="#3fb950"/><text x="690" y="101" fill="#3fb950">merge a main</text>
  </g>

  <!-- release -->
  <rect x="20" y="140" width="760" height="120" rx="8" fill="none" stroke="#30363d" stroke-dasharray="6 4"/>
  <text x="34" y="158" font-size="11.5" font-weight="700" fill="#a371f7">release.yml · etiqueta vX.Y.Z</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="172" width="120" height="40" rx="6" fill="#161b22" stroke="#8b949e"/><text x="100" y="197" fill="#e6edf3">git tag v1.3.0</text>
    <rect x="190" y="172" width="120" height="40" rx="6" fill="#161b22" stroke="#a371f7"/><text x="250" y="190" fill="#e6edf3">construir</text><text x="250" y="205" font-size="10" fill="#8b949e">APP_VERSION=1.3.0</text>
    <rect x="340" y="172" width="120" height="40" rx="6" fill="#161b22" stroke="#a371f7"/><text x="400" y="190" fill="#e6edf3">probar</text><text x="400" y="205" font-size="10" fill="#8b949e">la misma imagen</text>
    <rect x="490" y="172" width="120" height="40" rx="6" fill="#161b22" stroke="#a371f7"/><text x="550" y="190" fill="#e6edf3">publicar</text><text x="550" y="205" font-size="10" fill="#8b949e">GHCR :1.3.0</text>
    <rect x="640" y="172" width="120" height="40" rx="6" fill="#161b22" stroke="#d29922"/><text x="700" y="190" fill="#e6edf3">desplegar</text><text x="700" y="205" font-size="10" fill="#8b949e">ambiente produccion</text>
  </g>
  <text x="700" y="232" font-size="10.5" fill="#d29922" text-anchor="middle">aprobación opcional</text>
  <text x="700" y="248" font-size="10.5" fill="#8b949e" text-anchor="middle">deploy hook + verificación</text>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="190" y1="96" x2="238" y2="96" marker-end="url(#a)"/>
    <line x1="370" y1="96" x2="418" y2="96" marker-end="url(#a)"/>
    <line x1="570" y1="96" x2="618" y2="96" marker-end="url(#a)"/>
    <line x1="160" y1="192" x2="188" y2="192" marker-end="url(#a)"/>
    <line x1="310" y1="192" x2="338" y2="192" marker-end="url(#a)"/>
    <line x1="460" y1="192" x2="488" y2="192" marker-end="url(#a)"/>
    <line x1="610" y1="192" x2="638" y2="192" marker-end="url(#a)"/>
  </g>

  <rect x="20" y="276" width="370" height="40" rx="6" fill="#3a1414" stroke="#f85149"/>
  <text x="205" y="300" font-size="12" fill="#e6edf3" text-anchor="middle">Cualquier etapa falla: las siguientes no corren</text>
  <rect x="410" y="276" width="370" height="40" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="595" y="300" font-size="12" fill="#e6edf3" text-anchor="middle">Rollback: Run workflow con una versión publicada</text>
</svg>

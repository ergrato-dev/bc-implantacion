<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Despliegue por empuje y por arrastre</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-size="12.5" text-anchor="middle">
    <text x="200" y="64" font-size="14" font-weight="700" fill="#58a6ff">Empuje (push)</text>
    <rect x="40" y="84" width="130" height="50" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="105" y="114" fill="#e6edf3">Pipeline</text>
    <rect x="230" y="84" width="130" height="50" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="295" y="108" fill="#e6edf3">Render</text>
    <text x="295" y="124" font-size="10.5" fill="#8b949e">(o servidor por SSH)</text>
    <text x="200" y="172" font-size="11" fill="#8b949e">el pipeline tiene credenciales del destino</text>
    <text x="200" y="190" font-size="11" fill="#8b949e">el destino acepta conexiones desde Internet</text>

    <text x="600" y="64" font-size="14" font-weight="700" fill="#a371f7">Arrastre (pull)</text>
    <rect x="440" y="84" width="130" height="50" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="505" y="114" fill="#e6edf3">Pipeline</text>
    <rect x="440" y="200" width="130" height="50" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="505" y="224" fill="#e6edf3">Registro</text>
    <text x="505" y="240" font-size="10.5" fill="#8b949e">GHCR</text>
    <rect x="630" y="200" width="140" height="50" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="700" y="220" fill="#e6edf3">VM del laboratorio</text>
    <text x="700" y="238" font-size="10.5" fill="#8b949e">desplegar.sh 1.3.0</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="170" y1="109" x2="228" y2="109" marker-end="url(#a)"/>
    <line x1="505" y1="134" x2="505" y2="198" marker-end="url(#a)"/>
    <line x1="630" y1="225" x2="572" y2="225" marker-end="url(#a)"/>
  </g>
  <g font-size="10.5" fill="#8b949e" text-anchor="middle">
    <text x="199" y="100">deploy hook</text>
    <text x="545" y="170">publica</text>
    <text x="601" y="216">trae</text>
  </g>
  <text x="640" y="150" font-size="11" fill="#8b949e" text-anchor="middle">ninguna conexión entra</text>
  <text x="640" y="166" font-size="11" fill="#8b949e" text-anchor="middle">a la red institucional</text>

  <line x1="400" y1="52" x2="400" y2="280" stroke="#30363d" stroke-dasharray="4 4"/>
</svg>

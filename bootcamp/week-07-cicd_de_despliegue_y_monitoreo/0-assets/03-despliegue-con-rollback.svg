<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="360" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">desplegar.sh: verificación y rollback automático</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="20" y="52" width="520" height="92" rx="8" fill="none" stroke="#30363d" stroke-dasharray="6 4"/>
  <text x="34" y="70" font-size="11.5" font-weight="700" fill="#3fb950">La versión anterior sigue atendiendo</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="82" width="140" height="46" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="110" y="102" fill="#e6edf3">1. traer imagen</text><text x="110" y="118" font-size="10" fill="#8b949e">compose pull</text>
    <rect x="210" y="82" width="140" height="46" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="280" y="102" fill="#e6edf3">2. respaldar</text><text x="280" y="118" font-size="10" fill="#8b949e">pg_dump</text>
    <rect x="380" y="82" width="140" height="46" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="450" y="102" fill="#e6edf3">3. migrar</text><text x="450" y="118" font-size="10" fill="#8b949e">python -m app.main</text>

    <rect x="580" y="82" width="190" height="46" rx="6" fill="#3a1414" stroke="#f85149"/>
    <text x="675" y="102" fill="#f85149">falla: se detiene</text><text x="675" y="118" font-size="10" fill="#8b949e">nada cambió para el usuario</text>

    <rect x="210" y="190" width="170" height="46" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="295" y="210" fill="#e6edf3">4. cambiar la app</text><text x="295" y="226" font-size="10" fill="#8b949e">up --wait (healthcheck)</text>
    <rect x="420" y="190" width="170" height="46" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="505" y="210" fill="#e6edf3">5. verificar</text><text x="505" y="226" font-size="10" fill="#8b949e">humo + versión</text>

    <rect x="620" y="170" width="160" height="40" rx="6" fill="#12301c" stroke="#3fb950"/>
    <text x="700" y="195" fill="#3fb950">OK: en servicio</text>
    <rect x="620" y="240" width="160" height="46" rx="6" fill="#3a1414" stroke="#f85149"/>
    <text x="700" y="260" fill="#f85149">rollback automático</text><text x="700" y="276" font-size="10" fill="#8b949e">versión anterior</text>

    <rect x="210" y="300" width="380" height="40" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="400" y="325" fill="#e6edf3">6. todo queda en despliegues.log</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="180" y1="105" x2="208" y2="105" marker-end="url(#a)"/>
    <line x1="350" y1="105" x2="378" y2="105" marker-end="url(#a)"/>
    <line x1="520" y1="105" x2="578" y2="105" marker-end="url(#a)" stroke="#f85149"/>
    <path d="M450,128 L450,160 L295,160 L295,188" marker-end="url(#a)"/>
    <line x1="380" y1="213" x2="418" y2="213" marker-end="url(#a)"/>
    <path d="M590,205 L605,190 L618,190" marker-end="url(#a)" stroke="#3fb950"/>
    <path d="M590,222 L605,263 L618,263" marker-end="url(#a)" stroke="#f85149"/>
  </g>
  <text x="372" y="154" font-size="10.5" fill="#8b949e" text-anchor="middle">migración OK</text>
</svg>

# Laboratorio de la semana 7: despliegue desde un registro, rollback y monitoreo.
# Uso: cp .env.example .env && docker compose up -d --wait registro db kuma alertas
name: lab-s07

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Registro de imágenes local: hace el papel de GHCR.
  registro:
    image: registry:3
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registro:/var/lib/registry

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # La app de referencia, tomada del registro en la versión que diga APP_VERSION.
  app:
    image: ${IMAGEN}:${APP_VERSION:?Define APP_VERSION en .env}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Monitoreo de disponibilidad: http://localhost:3001
  kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma:/app/data

  # Receptor de alertas: imprime en su log cada notificación que envía Uptime Kuma.
  alertas:
    image: mendhak/http-https-echo:latest
    logging: *logging
    environment:
      LOG_IGNORE_PATH: /ping

volumes:
  registro:
  datos:
  kuma:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Ventana de mantenimiento de una migración</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Ventana -->
  <rect x="100" y="52" width="520" height="116" rx="8" fill="none" stroke="#21262d" stroke-dasharray="6 4"/>
  <text x="110" y="70" font-size="11" font-weight="700" fill="#8b949e">VENTANA · app detenida</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="16" y="90" width="76" height="52" rx="5" fill="#161b22" stroke="#8b949e"/>
    <text x="54" y="112" fill="#e6edf3">Anunciar</text>
    <text x="54" y="128" font-size="10" fill="#8b949e">usuarios</text>

    <rect x="110" y="90" width="76" height="52" rx="5" fill="#161b22" stroke="#1565c0"/>
    <text x="148" y="112" fill="#e6edf3">Congelar</text>
    <text x="148" y="128" font-size="10" fill="#8b949e">stop app</text>

    <rect x="196" y="90" width="76" height="52" rx="5" fill="#161b22" stroke="#1565c0"/>
    <text x="234" y="112" fill="#e6edf3">Volcar</text>
    <text x="234" y="128" font-size="10" fill="#8b949e">pg_dump</text>

    <rect x="282" y="90" width="76" height="52" rx="5" fill="#161b22" stroke="#1565c0"/>
    <text x="320" y="112" fill="#e6edf3">Restaurar</text>
    <text x="320" y="128" font-size="10" fill="#8b949e">--no-owner</text>

    <rect x="368" y="90" width="76" height="52" rx="5" fill="#161b22" stroke="#1565c0"/>
    <text x="406" y="112" fill="#e6edf3">Validar</text>
    <text x="406" y="128" font-size="10" fill="#8b949e">huellas</text>

    <rect x="454" y="90" width="76" height="52" rx="5" fill="#0d2040" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="492" y="112" fill="#58a6ff">Corte</text>
    <text x="492" y="128" font-size="10" fill="#8b949e">cambiar URL</text>

    <rect x="540" y="90" width="72" height="52" rx="5" fill="#12301c" stroke="#3fb950"/>
    <text x="576" y="112" fill="#3fb950">Verificar</text>
    <text x="576" y="128" font-size="10" fill="#8b949e">smoke test</text>

    <rect x="636" y="90" width="148" height="52" rx="5" fill="#161b22" stroke="#f85149"/>
    <text x="710" y="112" font-weight="700" fill="#f85149">Punto de no retorno</text>
    <text x="710" y="128" font-size="10" fill="#8b949e">abrir a usuarios</text>
  </g>

  <!-- Rollback -->
  <path d="M576,142 C576,196 148,196 148,146" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="362" y="222" font-size="11.5" font-weight="700" fill="#d29922" text-anchor="middle">Rollback: DATABASE_URL vuelve al origen (intacto)</text>

  <text x="400" y="262" font-size="11.5" fill="#e6edf3" text-anchor="middle">Después del punto de no retorno, los datos nuevos solo existen en el destino:</text>
  <text x="400" y="280" font-size="11.5" fill="#e6edf3" text-anchor="middle">volver atrás ya exige migrarlos de regreso</text>
</svg>

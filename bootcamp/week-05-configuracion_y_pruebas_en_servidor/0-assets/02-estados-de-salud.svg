<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="260" fill="#0d1117"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Estados de salud de un contenedor</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40" y="80" width="170" height="60" rx="30" fill="#161b22" stroke="#8b949e"/>
    <text x="125" y="106" fill="#e6edf3">starting</text>
    <text x="125" y="124" font-size="10.5" font-weight="400" fill="#8b949e">periodo de gracia</text>

    <rect x="315" y="80" width="170" height="60" rx="30" fill="#12301c" stroke="#3fb950"/>
    <text x="400" y="106" fill="#3fb950">healthy</text>
    <text x="400" y="124" font-size="10.5" font-weight="400" fill="#8b949e">última verificación OK</text>

    <rect x="590" y="80" width="170" height="60" rx="30" fill="#3a1414" stroke="#f85149"/>
    <text x="675" y="106" fill="#f85149">unhealthy</text>
    <text x="675" y="124" font-size="10.5" font-weight="400" fill="#8b949e">N fallos seguidos</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="210" y1="110" x2="313" y2="110" marker-end="url(#a)"/>
    <path d="M485,100 C530,70 550,70 588,100" marker-end="url(#a)"/>
    <path d="M588,122 C550,152 530,152 487,122" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#e6edf3" text-anchor="middle">
    <text x="262" y="100">verificación OK</text>
    <text x="537" y="66">falla "retries" veces</text>
    <text x="537" y="170">vuelve a pasar</text>
  </g>

  <rect x="120" y="196" width="560" height="46" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="400" y="216" font-size="12" font-weight="700" fill="#d29922" text-anchor="middle">Docker Compose no reinicia un contenedor unhealthy</text>
  <text x="400" y="233" font-size="11" fill="#8b949e" text-anchor="middle">el estado solo informa: reaccionar es tarea del monitoreo (semana 7)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Flujo del respaldo automatizado</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- servidor -->
  <rect x="20" y="56" width="530" height="250" rx="10" fill="none" stroke="#30363d" stroke-dasharray="6 4"/>
  <text x="36" y="76" font-size="12" font-weight="700" fill="#8b949e">Servidor</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="96" width="120" height="56" rx="8" fill="#161b22" stroke="#8b949e"/>
    <text x="100" y="120" font-weight="700" fill="#e6edf3">cron</text>
    <text x="100" y="138" font-size="10.5" fill="#8b949e">15 2 * * *</text>

    <rect x="200" y="96" width="150" height="56" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="275" y="120" font-weight="700" fill="#a371f7">pg_dump</text>
    <text x="275" y="138" font-size="10.5" fill="#8b949e">rol biblioteca_respaldo</text>

    <rect x="390" y="96" width="140" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="460" y="120" font-weight="700" fill="#58a6ff">restic backup</text>
    <text x="460" y="138" font-size="10.5" fill="#8b949e">cifra y deduplica</text>

    <rect x="390" y="200" width="140" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="460" y="222" font-weight="700" fill="#3fb950">Repositorio local</text>
    <text x="460" y="240" font-size="10.5" fill="#8b949e">forget --prune</text>
    <text x="460" y="256" font-size="10.5" fill="#8b949e">7 d · 4 s · 12 m</text>
    <text x="460" y="272" font-size="10.5" fill="#8b949e">check</text>

    <rect x="40" y="200" width="310" height="80" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="195" y="222" font-weight="700" fill="#d29922">Secretos (permisos 600)</text>
    <text x="195" y="242" font-size="10.5" fill="#8b949e">~respaldo/.pgpass → contraseña del rol</text>
    <text x="195" y="260" font-size="10.5" fill="#8b949e">/etc/restic/password → clave de cifrado</text>

    <rect x="600" y="96" width="180" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="690" y="120" font-weight="700" fill="#3fb950">Repositorio externo</text>
    <text x="690" y="140" font-size="10.5" fill="#8b949e">otra máquina / otra sede</text>
    <text x="690" y="158" font-size="10.5" fill="#f0883e">solo-agregar: borrar = 403</text>

    <rect x="600" y="220" width="180" height="60" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="690" y="244" font-weight="700" fill="#d29922">Gestor de contraseñas</text>
    <text x="690" y="262" font-size="10.5" fill="#8b949e">copia de la clave de restic</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="160" y1="124" x2="198" y2="124" marker-end="url(#a)"/>
    <line x1="350" y1="124" x2="388" y2="124" marker-end="url(#a)"/>
    <line x1="460" y1="152" x2="460" y2="198" marker-end="url(#a)"/>
    <line x1="530" y1="124" x2="598" y2="124" marker-end="url(#a)"/>
    <line x1="350" y1="240" x2="388" y2="240" stroke-dasharray="4 3"/>
    <line x1="690" y1="176" x2="690" y2="218" stroke-dasharray="4 3"/>
  </g>
  <text x="564" y="116" font-size="10.5" fill="#8b949e" text-anchor="middle">copia</text>

  <!-- restauracion -->
  <rect x="20" y="326" width="760" height="56" rx="8" fill="#12301c" stroke="#3fb950"/>
  <text x="400" y="348" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle">Restauración de desastre (servidor nuevo)</text>
  <text x="400" y="367" font-size="11" fill="#e6edf3" text-anchor="middle">roles (01-roles.sql) → clave desde el gestor → restic dump del externo → pg_restore → huellas → prueba de humo</text>
</svg>

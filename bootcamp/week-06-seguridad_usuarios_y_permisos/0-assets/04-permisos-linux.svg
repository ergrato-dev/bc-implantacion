<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Inter,Roboto,'Open Sans',system-ui,sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="400" y="32" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Lectura de permisos en Linux</text>

  <g font-size="22" font-family="'JetBrains Mono','Fira Code',monospace" text-anchor="middle">
    <text x="70" y="86" fill="#8b949e">-</text>
    <text x="160" y="86" fill="#58a6ff">rw-</text>
    <text x="260" y="86" fill="#a371f7">r--</text>
    <text x="360" y="86" fill="#f85149">---</text>
    <text x="490" y="86" fill="#58a6ff">root</text>
    <text x="630" y="86" fill="#a371f7">despliegue</text>
    <text x="750" y="86" fill="#e6edf3">.env</text>
  </g>

  <g stroke-width="2">
    <line x1="70" y1="98" x2="70" y2="118" stroke="#8b949e"/>
    <line x1="160" y1="98" x2="160" y2="118" stroke="#58a6ff"/>
    <line x1="260" y1="98" x2="260" y2="118" stroke="#a371f7"/>
    <line x1="360" y1="98" x2="360" y2="118" stroke="#f85149"/>
    <line x1="490" y1="98" x2="490" y2="118" stroke="#58a6ff"/>
    <line x1="630" y1="98" x2="630" y2="118" stroke="#a371f7"/>
  </g>

  <g font-size="11.5" text-anchor="middle">
    <text x="70" y="136" fill="#8b949e">tipo</text>
    <text x="70" y="152" fill="#8b949e">- archivo</text>
    <text x="70" y="166" fill="#8b949e">d carpeta</text>

    <text x="160" y="136" font-weight="700" fill="#58a6ff">dueño</text>
    <text x="160" y="152" fill="#e6edf3">4+2+0 = 6</text>

    <text x="260" y="136" font-weight="700" fill="#a371f7">grupo</text>
    <text x="260" y="152" fill="#e6edf3">4+0+0 = 4</text>

    <text x="360" y="136" font-weight="700" fill="#f85149">otros</text>
    <text x="360" y="152" fill="#e6edf3">0</text>

    <text x="490" y="136" fill="#58a6ff">usuario dueño</text>
    <text x="630" y="136" fill="#a371f7">grupo dueño</text>
  </g>

  <rect x="150" y="186" width="500" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="400" y="211" font-size="14" font-weight="700" fill="#3fb950" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace">chmod 640 .env   ·   chown root:despliegue .env</text>

  <g font-size="12" text-anchor="middle">
    <rect x="60" y="244" width="210" height="40" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="165" y="269" fill="#e6edf3"><tspan font-weight="700">r = 4</tspan>  leer · listar</text>
    <rect x="295" y="244" width="210" height="40" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="400" y="269" fill="#e6edf3"><tspan font-weight="700">w = 2</tspan>  escribir · crear/borrar</text>
    <rect x="530" y="244" width="210" height="40" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="635" y="269" fill="#e6edf3"><tspan font-weight="700">x = 1</tspan>  ejecutar · entrar</text>
  </g>
</svg>

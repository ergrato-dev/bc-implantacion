# Despliegue de producción en un servidor Linux con Docker.
# Se copia al servidor como /opt/biblioteca/compose.yaml junto con .env y Caddyfile.
# A diferencia de ../compose.yaml, NO construye: usa una imagen ya liberada (IMAGEN:APP_VERSION).
# Actualizar a otra versión: bash desplegar.sh <versión> (semana 7).

# Rotación de logs: sin esto, los logs de Docker crecen hasta llenar el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${IMAGEN:-biblioteca}:${APP_VERSION:?Define APP_VERSION en .env}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  datos:
  caddy_data:
